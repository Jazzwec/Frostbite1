<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Frostbite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Layout: one-column phone game. HUD on top, a window onto the snowy city, scrolling tab body, thumb tab bar at the bottom.
   One deliberate look: daylight snow and ice, with the furnace's ember as the only warm colour. */
:root {
  --snow: #E4ECF2;
  --snow-deep: #D3DFE8;
  --ice: #F5F9FB;
  --line: #C6D4DF;
  --ink: #1A2938;
  --slate: #586A7C;
  --frost: #3A86A6;
  --ember: #DD5B1A;
  --ember-deep: #B8460F;
  --ember-soft: #FCE6D7;
  --danger: #B93A2B;
  --warn: #B07A0C;
  --warn-soft: #FBF0D5;
  --good: #357F51;
  --wood: #8A5A34;
  --food: #B04B33;
  --mat: #4F6A86;
  --know: #6550A0;
  --display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 12px;
  color-scheme: light;
}
html { height: 100%; box-sizing: border-box; background: var(--snow-deep); }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; background: var(--snow-deep); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--frost); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

#app { height: 100%; max-width: 480px; margin: 0 auto; display: grid; grid-template-rows: auto 1fr auto; background: var(--snow); position: relative; overflow: hidden; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* HUD */
.hud { padding-block: 10px 8px; display: grid; gap: 8px; background: var(--snow); border-bottom: 1px solid var(--line); }
.hud-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: 0.01em; color: var(--ink); }
.brand span { font-size: 12px; color: var(--slate); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--ice); border-radius: 10px; cursor: pointer; }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: var(--slate); stroke-width: 2; }

.heat { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; }
.heat .ic { color: var(--ember); }
.heat-bar { height: 14px; border-radius: 8px; background: var(--snow-deep); overflow: hidden; position: relative; box-shadow: inset 0 1px 2px rgba(26,41,56,.12); }
.heat-fill { position: absolute; inset: 0 auto 0 0; width: 100%; border-radius: 8px; background: linear-gradient(90deg, #E8892F, var(--ember)); transition: width .3s linear, background .3s; }
.heat-fill.cold { background: linear-gradient(90deg, #8FC2DA, var(--frost)); }
.heat-line { position: absolute; top: 0; bottom: 0; left: 30%; width: 2px; background: rgba(255,255,255,.7); }
.heat-txt { grid-column: 2; display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--slate); }
.heat-txt b { color: var(--ink); font-size: 13px; }
.heat-txt .bad { color: var(--danger); font-weight: 700; }

.chips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--ice); border: 1px solid var(--line); border-radius: var(--r); }
.chip { padding: 6px 4px 5px; display: grid; justify-items: center; gap: 1px; min-width: 0; border-left: 1px solid var(--line); }
.chip:first-child { border-left: 0; }
.chip .top { display: flex; align-items: center; gap: 4px; max-width: 100%; }
.chip .val { font-family: var(--display); font-size: 15px; line-height: 1.1; white-space: nowrap; }
.chip .sub { font-size: 10.5px; color: var(--slate); white-space: nowrap; }
.chip .sub.up { color: var(--good); }
.chip .sub.down { color: var(--danger); }
.chip .cap { width: 80%; height: 3px; border-radius: 2px; background: var(--snow-deep); overflow: hidden; margin-top: 2px; }
.chip .cap i { display: block; height: 100%; background: currentColor; opacity: .55; }
.ic { display: inline-grid; place-items: center; width: 15px; height: 15px; flex: none; }
.ic svg { width: 100%; height: 100%; fill: currentColor; }
.c-wood { color: var(--wood); } .c-food { color: var(--food); } .c-materials { color: var(--mat); } .c-knowledge { color: var(--know); } .c-jans { color: var(--ink); }

.forecast { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 7px 10px; border-radius: 10px; background: var(--ice); border: 1px solid var(--line); color: var(--slate); }
.forecast b { color: var(--ink); }
.forecast.warn { background: var(--warn-soft); border-color: #E6C98A; color: #6E4E08; }
.forecast.storm { background: #E3EEF6; border-color: var(--frost); color: #1F5670; animation: pulse 1.6s ease-in-out infinite; }
.forecast .flake { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; }
@keyframes pulse { 50% { background: #D2E5F1; } }

/* Body */
main { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; min-height: 0; }
.tab { padding-block: 12px 20px; display: grid; gap: 12px; align-content: start; }

.scene-wrap { position: relative; height: clamp(250px, 44vh, 400px); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: #E8F0F5; box-shadow: 0 1px 0 rgba(255,255,255,.8) inset; }
#scene { width: 100%; height: 100%; display: block; touch-action: manipulation; cursor: pointer; }
.toast { position: absolute; left: 10px; right: 10px; top: 10px; background: var(--ice); border: 1px solid var(--line); border-left: 4px solid var(--ember); border-radius: 10px; padding: 10px 12px; box-shadow: 0 6px 18px rgba(26,41,56,.18); cursor: pointer; animation: drop .35s ease-out; }
.toast b { font-family: var(--display); font-weight: 400; font-size: 17px; display: block; }
.toast span { font-size: 13.5px; color: var(--slate); }
.toast small { display: block; font-size: 11px; color: var(--ember-deep); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 2px; }
@keyframes drop { from { transform: translateY(-12px); opacity: 0; } }
.hint { position: absolute; left: 10px; bottom: 10px; font-size: 11.5px; color: var(--slate); background: rgba(245,249,251,.85); padding: 3px 8px; border-radius: 999px; pointer-events: none; }

.card { background: var(--ice); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; }
.card h3, .sec-title { margin: 0; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--slate); font-weight: 700; }
.next { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.next .name { font-family: var(--display); font-size: 18px; line-height: 1.15; text-wrap: balance; }
.next .desc { font-size: 13px; color: var(--slate); }
.costs { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; }
.cost { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.cost.short { color: var(--danger); }
.cost.short .ic { opacity: .7; }

.btn { border: 0; border-radius: 10px; padding: 10px 14px; min-height: 44px; min-width: 88px; font-weight: 700; font-size: 14px; background: var(--ember); color: #fff; cursor: pointer; transition: transform .08s, background .15s; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn:disabled { background: var(--snow-deep); color: var(--slate); cursor: default; font-weight: 400; }
.btn.ghost { background: var(--ice); color: var(--ink); border: 1px solid var(--line); }
.btn.quiet { background: transparent; color: var(--slate); min-width: 0; }
.btn.danger { background: var(--danger); }
.btn.wide { width: 100%; }

.thaw-card { background: linear-gradient(135deg, var(--ember-soft), #FFF6EE); border-color: #F0BE9C; }
.thaw-card .name { font-family: var(--display); font-size: 20px; }

.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.log li { font-size: 13px; color: var(--slate); display: grid; grid-template-columns: 54px 1fr; gap: 8px; }
.log li time { font-variant-numeric: tabular-nums; color: #8797A6; font-size: 12px; }
.log li.hot { color: var(--ink); }

/* Lists */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--snow-deep); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 8px 6px; font-weight: 700; font-size: 13.5px; color: var(--slate); cursor: pointer; min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--ice); color: var(--ink); box-shadow: 0 1px 2px rgba(26,41,56,.15); }
.list { display: grid; background: var(--ice); border: 1px solid var(--line); border-radius: var(--r); }
.row { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 12px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row-main { min-width: 0; display: grid; gap: 3px; }
.row-title { font-weight: 700; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.lvl { font-size: 12px; color: var(--slate); font-weight: 400; font-variant-numeric: tabular-nums; }
.row-desc { font-size: 13px; color: var(--slate); }
.row.locked { opacity: .55; }
.row.locked .row-desc { font-style: italic; }
.note { font-size: 13px; color: var(--slate); }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--snow-deep); color: var(--slate); letter-spacing: .03em; }
.pill.ember { background: var(--ember-soft); color: var(--ember-deep); }
.learned { display: flex; flex-wrap: wrap; gap: 6px; }

.job { grid-template-columns: 1fr auto; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--snow); font-size: 22px; line-height: 1; cursor: pointer; font-weight: 700; color: var(--ink); }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper .count { min-width: 30px; text-align: center; font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.rate { font-size: 13px; font-weight: 700; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; }
.toggle { width: 52px; height: 32px; border-radius: 999px; border: 0; background: var(--snow-deep); position: relative; cursor: pointer; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: left .15s; }
.toggle[aria-pressed="true"] { background: var(--ember); }
.toggle[aria-pressed="true"]::after { left: 23px; }
.toggle:disabled { opacity: .45; cursor: default; }
.roster { display: flex; flex-wrap: wrap; gap: 6px; }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.jan-card { background: var(--ice); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: grid; gap: 4px; align-content: start; }
.jan-card canvas { width: 72px; height: 72px; justify-self: center; }
.jan-card b { font-family: var(--display); font-weight: 400; font-size: 16px; line-height: 1.15; }
.jan-card .bonus { font-size: 12px; color: var(--ember-deep); font-weight: 700; }
.jan-card p { margin: 0; font-size: 12.5px; color: var(--slate); }
.jan-card.unknown b { color: var(--slate); }
.jan-card .seen { font-size: 11.5px; color: var(--slate); }
.progress-line { font-size: 13px; color: var(--slate); }

/* Tab bar */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--ice); padding-block: 4px 6px; }
.tabs button { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; min-height: 52px; font-size: 11.5px; font-weight: 700; color: var(--slate); cursor: pointer; position: relative; }
.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-current="page"] { color: var(--ember); }
.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: -5px; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ember); }
.badge { position: absolute; top: 4px; left: 55%; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--ember); color: #fff; font-size: 11px; line-height: 18px; }

/* Sheets */
.overlay { position: absolute; inset: 0; background: rgba(26,41,56,.45); display: grid; align-items: end; z-index: 20; animation: fade .2s ease-out; }
.sheet { background: var(--snow); border-radius: 18px 18px 0 0; max-height: 88%; overflow-y: auto; padding-block: 18px 22px; display: grid; gap: 14px; animation: rise .25s ease-out; }
.sheet h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.1; text-wrap: balance; }
.sheet p { margin: 0; }
.story { display: grid; gap: 8px; font-size: 16px; }
.story p:last-child { color: var(--ember-deep); font-weight: 700; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--slate); } .kv dd { margin: 0; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.tip { font-size: 13px; color: var(--slate); border-left: 3px solid var(--frost); padding-left: 10px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { flex: 1; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(30px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (min-width: 520px) { #app { box-shadow: 0 0 0 1px var(--line), 0 10px 40px rgba(26,41,56,.12); } }
</style>

<div id="app">
  <header class="hud pad">
    <div class="hud-top">
      <div class="brand"><b>Frostbite</b><span id="winterLbl">Winter 1 · Tier 1</span></div>
      <button class="icon-btn" data-act="settings" aria-label="Settings and test speed"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div class="heat">
      <span class="ic" id="heatIc"></span>
      <div class="heat-bar" role="meter" aria-label="Furnace heat" aria-valuemin="0" aria-valuemax="100" id="heatBar"><div class="heat-fill" id="heatFill"></div><div class="heat-line"></div></div>
      <div class="heat-txt"><span><b id="heatPct" class="num">100%</b> heat</span><span id="heatSub">Burning 0.1 Wood/s</span></div>

    <div class="chips" id="chips"></div>
    <div class="forecast" id="forecast"></div>
  </header>

  <main id="main">
    <section class="tab pad" id="tab-city">
      <div class="scene-wrap" id="sceneWrap">
        <canvas id="scene" aria-label="The city. Tap frozen Jans at the bottom edge to rescue them."></canvas>
        <div class="toast" id="toast" hidden data-act="dismissToast"></div>
        <div class="hint" id="hint">Tap a frozen Jan to rescue him</div>
      </div>
      <div id="cityCards" style="display:grid;gap:12px"></div>
      <div class="card"><h3>What's been happening</h3><ol class="log" id="log"></ol></div>
    </section>
    <section class="tab pad" id="tab-build" hidden></section>
    <section class="tab pad" id="tab-jans" hidden></section>
    <section class="tab pad" id="tab-found" hidden></section>
  </main>

  <nav class="tabs pad" aria-label="Screens">
    <button data-act="tab" data-arg="city" aria-current="page"><svg viewBox="0 0 24 24"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-4 2-5 0 2 1 3 2 3 0-3-1-5 1-8z"/></svg>City</button>
    <button data-act="tab" data-arg="build"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V10l7-6 7 6v11M10 21v-6h4v6"/></svg>Build<span class="badge" id="buildBadge" hidden></span></button>
    <button data-act="tab" data-arg="jans"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-4 2.7-6.5 6-6.5s6 2.5 6 6.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 13.6c3 .2 5 2.5 5 6"/></svg>Jans<span class="badge" id="jansBadge" hidden></span></button>
    <button data-act="tab" data-arg="found"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Collection</button>
  </nav>

  <div class="overlay" id="overlay" hidden><div class="sheet pad" id="sheet" role="dialog" aria-modal="true"></div></div>
</div>

<script>

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const tierOf = F => (F >= 7 ? 3 : F >= 4 ? 2 : 1);

function rMult(s, key, job) {
  let m = 1;
  for (const r of RESEARCH) if (s.research[r.id] && r[key] != null && (!job || r.job === job)) m *= r[key];
  return m;
}

function newState() {
  const s = {
    v: 1, winter: 1, totalT: 0, tokens: 0, nextId: 1,
    shop: { warm: 0, walls: 0, feet: 0, pockets: 0, friends: 0, head: 0 },
    found: Object.fromEntries(VARIANT_ORDER.map(v => [v, 0])),
    milestones: {},
    stats: { rescued: 0, blizzards: 0, winters: 0 },
  };
  newWinter(s, []);
  return s;
}

function newWinter(s, vets) {
  const warm = s.shop.warm > 0;
  s.t = 0; s.heat = warm ? 200 : 100; s.lastBurn = 0;
  s.res = { wood: 40 + (warm ? 50 : 0), food: 40, materials: 0, knowledge: 0 };
  s.bld = Object.fromEntries(BLD_ORDER.map(k => [k, BLD[k].start]));
  if (warm) s.bld.furnace = 2;
  s.jans = [];
  for (const job of ['chop', 'chop', 'hunt']) { s.jans.push({ id: s.nextId++, v: 'plain', job, vet: false }); s.found.plain++; }
  for (const v of vets) s.jans.push({ id: s.nextId++, v: v.v, job: 'chop', vet: true });
  s.waiting = []; s.lost = [];
  s.arrivalT = 40; s.scavT = 0; s.leaveT = 0;
  s.bz = { next: BAL.blizzard.first, active: false, end: 0, long: false, warned: false };
  s.longDoneTier = 1;
  s.caravanNext = BAL.caravan.first;
  s.research = {}; s.researchBought = 0;
  s.autoAssign = false;
}

// ---- derived values ----
const janCap = s => BAL.capPerFurnace * s.bld.furnace + BAL.capPerBunk * s.bld.bunkhouse;
const heatCap = s => 100 * s.bld.furnace;
const cold = s => BAL.coldGrowth ** (s.bld.furnace - 1);
const heatPerWood = s => BAL.heatPerWood * rMult(s, 'heatPerWood');
function drain(s, blizzardOverride) {
  const bz = blizzardOverride == null ? s.bz.active : blizzardOverride;
  return (BAL.drainBase + BAL.drainPerJan * s.jans.length) * cold(s) * rMult(s, 'drain')
    * 0.9 ** s.bld.springs * 0.95 ** s.shop.walls * (bz ? BAL.blizzard.mult * rMult(s, 'blizzard') : 1);
}
const woodBurnRate = (s, bz) => drain(s, bz) / heatPerWood(s);
function foodUse(s) {
  let n = 0;
  for (const j of s.jans) n += VARIANTS[j.v].food || 1;
  return n * BAL.foodPerJan * cold(s) ** BAL.foodColdExp * 0.95 ** s.bld.kitchen * rMult(s, 'food');
}
function storeMult(s) { return BAL.caps.storeGrowth ** s.bld.storehouse * BAL.caps.furnaceGrowth ** (s.bld.furnace - 1) * (1 + 0.25 * s.shop.pockets); }
function caps(s) {
  const m = storeMult(s), c = BAL.caps;
  return {
    wood: (c.wood + c.woodPerLumber * s.bld.lumber) * m * rMult(s, 'woodCap'),
    food: c.food * m * rMult(s, 'storeCap'),
    materials: c.materials * m * rMult(s, 'storeCap'),
    knowledge: Infinity,
  };
}
function condMult(s) {
  let m = 1;
  if (s.heat / heatCap(s) < BAL.coldLine) m *= hasR(s, 'lanterns') ? 0.7 : BAL.coldMult;
  if (s.res.food <= 0) m *= BAL.hungryMult;
  return m;
}
const hasR = (s, id) => !!s.research[id];
function globalMult(s) {
  let vets = 0, djs = 0;
  for (const j of s.jans) { if (j.vet) vets++; if (j.v === 'dj') djs++; }
  return (1 + 0.05 * vets) * (1 + 0.05 * Math.min(3, djs)) * rMult(s, 'all') * (1 + 0.1 * s.shop.head) * condMult(s);
}
function janJobMult(j, job) {
  const V = VARIANTS[j.v];
  return ((V.job && V.job[job]) || 1) * (V.work || 1);
}
function perJanBase(s, job) {
  const J = JOBS[job], lvl = s.bld[J.bld];
  if (!lvl) return 0;
  return J.base * J.growth ** (lvl - 1) * rMult(s, 'mult', job);
}
function jobCount(s) {
  const c = { idle: 0, chop: 0, hunt: 0, build: 0, research: 0, scavenge: 0 };
  for (const j of s.jans) c[j.job]++;
  return c;
}
function jobRate(s, job, gm) {
  const base = perJanBase(s, job);
  if (!base) return 0;
  let sum = 0;
  for (const j of s.jans) if (j.job === job) sum += janJobMult(j, job);
  return base * sum * (gm == null ? globalMult(s) : gm);
}
const scavInterval = s => BAL.scavenge.interval * BAL.scavenge.intervalGrowth ** Math.max(0, s.bld.expedition - 1);
function scavBurst(s, res) {
  return BAL.scavenge.bursts[res] * BAL.scavenge.growth ** Math.max(0, s.bld.expedition - 1) * rMult(s, 'scav') * cold(s) ** 0.5;
}
// Net per-second rates for display and for auto-assign.
function rates(s) {
  const gm = globalMult(s);
  const r = { wood: jobRate(s, 'chop', gm), food: jobRate(s, 'hunt', gm), materials: jobRate(s, 'build', gm), knowledge: jobRate(s, 'research', gm) };
  const burn = s.res.wood > 0 || r.wood > 0 ? woodBurnRate(s) : 0;
  return { gross: { ...r }, burn, eat: foodUse(s), wood: r.wood - burn, food: r.food - foodUse(s), materials: r.materials, knowledge: r.knowledge };
}
function arrivalInterval(s) {
  const fill = s.jans.length / janCap(s);
  return BAL.arrivalBase * 0.9 ** s.shop.feet * rMult(s, 'arrival') * (1 + 2 * fill * fill);
}
const warnTime = s => (s.bz.long ? BAL.blizzard.longWarn : BAL.blizzard.warn) + BAL.blizzard.towerWarn * s.bld.watchtower;

// ---- costs and purchases ----
function costOf(s, key) {
  const raw = BLD[key].cost(s.bld[key], s), out = {};
  for (const k in raw) if (raw[k] > 0) out[k] = Math.ceil(raw[k]);
  return out;
}
const canAfford = (s, c) => Object.keys(c).every(k => s.res[k] >= c[k]);
function fitsStorage(s, c) { const cp = caps(s); return Object.keys(c).every(k => c[k] <= cp[k]); }
const isUnlocked = (s, key) => s.bld.furnace >= BLD[key].unlock;
function maxLevel(s, key) {
  const M = BLD[key].max;
  if (key === 'furnace' || !BAL.gate) return M;
  return Math.max(1, Math.ceil(M * s.bld.furnace / 10));
}
const isMaxed = (s, key) => s.bld[key] >= maxLevel(s, key);
function pay(s, c) { for (const k in c) s.res[k] -= c[k]; }
function buy(s, key) {
  if (!isUnlocked(s, key) || isMaxed(s, key)) return false;
  const c = costOf(s, key);
  if (!canAfford(s, c)) return false;
  pay(s, c); s.bld[key]++;
  if (key === 'furnace') s.heat = Math.min(s.heat + 100, heatCap(s));
  return true;
}
const researchCost = s => Math.ceil(BAL.research.base * BAL.research.growth ** s.researchBought);
function researchAvailable(s, r) {
  if (s.research[r.id]) return false;
  if (r.after && !s.research[r.after]) return false;
  if (r.tier && tierOf(s.bld.furnace) < r.tier) return false;
  return true;
}
function buyResearch(s, id) {
  const r = RESEARCH.find(x => x.id === id), c = researchCost(s);
  if (!r || !researchAvailable(s, r) || s.res.knowledge < c) return false;
  s.res.knowledge -= c; s.research[id] = true; s.researchBought++;
  return true;
}
function shopCost(key) { return SHOP[key].cost; }
function buyShop(s, key) {
  if (s.shop[key] >= SHOP[key].max || s.tokens < shopCost(key)) return false;
  s.tokens -= shopCost(key); s.shop[key]++;
  return true;
}

// ---- Jans ----
function pickVariant(s, rareOnly) {
  const pool = VARIANT_ORDER.filter(v => VARIANTS[v].weight > 0 && VARIANTS[v].unlock(s) && (!rareOnly || v !== 'plain'));
  if (!pool.length) return 'plain';
  const total = pool.reduce((a, v) => a + VARIANTS[v].weight, 0);
  let x = Math.random() * total;
  for (const v of pool) { x -= VARIANTS[v].weight; if (x <= 0) return v; }
  return pool[pool.length - 1];
}
function freeSlot(s) {
  const used = new Set(s.waiting.map(w => w.slot));
  for (let i = 0; i < BAL.maxWaitingCaravan; i++) if (!used.has(i)) return i;
  return 0;
}
function addArrival(s, v, returning) {
  s.waiting.push({ id: s.nextId++, v: v || null, slot: freeSlot(s), returning: !!returning });
}
function rescue(s, wid) {
  const i = s.waiting.findIndex(w => w.id === wid);
  if (i < 0) return { ok: false, reason: 'gone' };
  if (s.jans.length >= janCap(s)) return { ok: false, reason: 'cap' };
  const w = s.waiting.splice(i, 1)[0];
  const v = w.v || pickVariant(s);
  const jan = { id: w.id, v, job: 'idle', vet: false };
  s.jans.push(jan);
  if (!w.returning) { s.found[v]++; s.stats.rescued++; }
  let bonus = null;
  if (v === 'keys' && !w.returning) {
    const res = ['wood', 'food', 'materials'][Math.floor(Math.random() * 3)];
    const rt = rates(s).gross[res];
    const amt = Math.max(res === 'materials' ? 5 : 20, rt * 45);
    s.res[res] = Math.min(caps(s)[res], s.res[res] + amt);
    bonus = { res, amt };
  }
  if (s.autoAssign) { const job = neededJob(s); if (job) jan.job = job; }
  return { ok: true, jan, bonus, returning: w.returning };
}
function jobAvailable(s, job) { return s.bld[JOBS[job].bld] > 0; }
function assign(s, job, delta) {
  if (delta > 0) {
    if (!jobAvailable(s, job)) return false;
    const idle = s.jans.filter(j => j.job === 'idle');
    if (!idle.length) return false;
    idle.sort((a, b) => janJobMult(b, job) - janJobMult(a, job));
    idle[0].job = job;
  } else {
    const inJob = s.jans.filter(j => j.job === job);
    if (!inJob.length) return false;
    inJob.sort((a, b) => janJobMult(a, job) - janJobMult(b, job));
    inJob[0].job = 'idle';
  }
  return true;
}
const SHARE = { chop: 0.42, hunt: 0.13, build: 0.25, research: 0.12, scavenge: 0.08 };
function neededJob(s) {
  const avail = JOB_ORDER.filter(j => jobAvailable(s, j));
  const r = rates(s);
  if (r.food < 0.02) return 'hunt';
  if (r.gross.wood < woodBurnRate(s, true) * 0.7) return 'chop';
  const c = jobCount(s), n = s.jans.length;
  let best = 'chop', gap = -Infinity;
  const tot = avail.reduce((a, j) => a + SHARE[j], 0);
  for (const j of avail) { const g = (SHARE[j] / tot) * n - c[j]; if (g > gap) { gap = g; best = j; } }
  return best;
}
function autoAssignAll(s) {
  for (const j of s.jans) if (j.job === 'idle') j.job = neededJob(s);
}

// ---- prestige ----
const canPrestige = s => s.bld.furnace >= 10;
const tokensEarned = s => s.bld.furnace + Math.floor(s.jans.length / 10);
const vetSlots = s => 3 + s.shop.friends;
function doPrestige(s, vetIds) {
  const vets = s.jans.filter(j => vetIds.includes(j.id)).slice(0, vetSlots(s));
  s.tokens += tokensEarned(s);
  s.found.veteran += vets.filter(v => !v.vet).length;
  s.winter++; s.stats.winters++;

// ---- the tick ----
function scheduleBlizzard(s) {
  const tier = tierOf(s.bld.furnace);
  s.bz.long = tier > s.longDoneTier;
  if (s.bz.long) s.longDoneTier = tier;
  s.bz.next = s.t + rnd(BAL.blizzard.gapMin, BAL.blizzard.gapMax);
  s.bz.warned = false;
}
function tick(s, dt, ev) {
  const prevSec = Math.floor(s.t);
  s.t += dt; s.totalT += dt;
  const bz = s.bz;
  if (bz.active) {
    if (s.t >= bz.end) { bz.active = false; s.stats.blizzards++; ev.push({ type: 'blizzardEnd', long: bz.long }); scheduleBlizzard(s); }
  } else if (s.t >= bz.next) {
    bz.active = true; bz.warned = true; bz.end = s.t + (bz.long ? BAL.blizzard.longDur : BAL.blizzard.dur);
    ev.push({ type: 'blizzardStart', long: bz.long });
  } else if (!bz.warned && s.t >= bz.next - warnTime(s)) {
    bz.warned = true; ev.push({ type: 'blizzardWarn', long: bz.long });
  }

  // heat: the furnace burns whatever wood it needs to stay full
  const d = drain(s) * dt, hpw = heatPerWood(s), hc = heatCap(s);
  const burn = Math.min(s.res.wood, Math.max(0, hc - s.heat + d) / hpw);
  s.res.wood -= burn; s.lastBurn = burn / dt;
  s.heat = clamp(s.heat + burn * hpw - d, 0, hc);

  // production and food
  const gm = globalMult(s), cp = caps(s);
  s.res.wood += jobRate(s, 'chop', gm) * dt;
  s.res.food += (jobRate(s, 'hunt', gm) - foodUse(s)) * dt;
  s.res.materials += jobRate(s, 'build', gm) * dt;
  s.res.knowledge += jobRate(s, 'research', gm) * dt;
  for (const k of ['wood', 'food', 'materials']) s.res[k] = clamp(s.res[k], 0, cp[k]);

  // scavenging
  const scav = s.jans.reduce((a, j) => a + (j.job === 'scavenge' ? janJobMult(j, 'scavenge') : 0), 0);
  if (scav && s.bld.expedition) {
    s.scavT += dt * scav * gm / scavInterval(s);
    while (s.scavT >= 1) {
      s.scavT -= 1;
      const res = ['wood', 'wood', 'food', 'materials'][Math.floor(Math.random() * 4)];
      const amt = scavBurst(s, res);
      s.res[res] = Math.min(cp[res], s.res[res] + amt);
      ev.push({ type: 'burst', res, amt });
    }
  }

  // arrivals and caravans pause during blizzards
  if (!bz.active) {
    s.arrivalT += dt;
    if (s.arrivalT >= arrivalInterval(s)) {
      s.arrivalT = 0;
      if (s.waiting.length < BAL.maxWaiting) { addArrival(s); ev.push({ type: 'arrival' }); }
    }
    if (s.t >= s.caravanNext) {
      s.caravanNext = s.t + rnd(BAL.caravan.gapMin, BAL.caravan.gapMax);
      const n = 3 + Math.floor(Math.random() * 3);
      let added = 0;
      for (const l of s.lost.splice(0)) { if (s.waiting.length < BAL.maxWaitingCaravan) { addArrival(s, l.v, true); added++; } }
      for (let i = 0; i < n && s.waiting.length < BAL.maxWaitingCaravan; i++) { addArrival(s, i === 0 ? pickVariant(s, true) : null); added++; }
      ev.push({ type: 'caravan', n: added });
    }
  }

  // heat at zero: a Jan wanders off every minute
  if (s.heat <= 0.001 && s.jans.some(j => !j.vet)) {
    s.leaveT += dt;
    if (s.leaveT >= BAL.leaveEvery) {
      s.leaveT = 0;
      const pool = s.jans.filter(j => !j.vet);
      const j = pool[Math.floor(Math.random() * pool.length)];
      s.jans.splice(s.jans.indexOf(j), 1);
      s.lost.push({ v: j.v });
      ev.push({ type: 'janLeft', jan: j });
    }
  } else s.leaveT = 0;

  if (Math.floor(s.t) !== prevSec) {
    for (const m of MILESTONES) if (!s.milestones[m.id] && m.check(s)) { s.milestones[m.id] = true; ev.push({ type: 'milestone', id: m.id }); }
  }
}

function renderBuild(r) {
  const el = $('tab-build');
  const sig = JSON.stringify([S.bld, S.research, S.tokens, S.shop, ui.seg, S.winter]);
  if (ui.sigs.build !== sig) {
    ui.sigs.build = sig;
    const segs = [['buildings', 'Buildings'], ['research', 'Research']];
    if (S.winter > 1 || S.tokens > 0) segs.push(['warmth', 'Warmth']);
    let h = `<div class="seg" role="group" aria-label="Build sections">${segs.map(([k, n]) => `<button data-act="seg" data-arg="${k}" aria-pressed="${ui.seg === k}">${n}</button>`).join('')}</div>`;
    if (ui.seg === 'buildings') {
      h += '<div class="list">';
      for (const k of BLD_ORDER) {
        const B = BLD[k], lvl = S.bld[k];
        if (!isUnlocked(S, k)) { h += `<div class="row locked"><div class="row-main"><div class="row-title">${B.name}</div><div class="row-desc">Unlocks at Furnace ${B.unlock}</div></div></div>`; continue; }
        const ml = maxLevel(S, k), hardMax = lvl >= B.max;
        let right, extra = '';
        if (hardMax) right = '<span class="pill">Max</span>';
        else if (lvl >= ml) { right = '<span class="pill">Capped</span>'; extra = `<div class="note">Can't outgrow the Furnace. Upgrade it to go past Lv ${ml}.</div>`; }
        else { const c = costOf(S, k); right = buyBtn('buy', k, c, lvl ? 'Upgrade' : 'Build'); extra = costHTML(c); }
        h += `<div class="row"><div class="row-main"><div class="row-title">${B.name} <span class="lvl">${lvl ? `Lv ${lvl}${hardMax ? '' : ' / ' + (k === 'furnace' ? B.max : ml)}` : 'Not built'}</span></div><div class="row-desc">${B.desc}</div>${extra}</div>${right}</div>`;
      }
      h += '</div>';
    } else if (ui.seg === 'research') {
      if (!S.bld.research) h += `<div class="card"><p class="note">Build a Research Hut (Furnace ${BLD.research.unlock}) and put Jans on Research to earn Knowledge.</p></div>`;
      const c = { knowledge: researchCost(S) };
      const avail = RESEARCH.filter(x => researchAvailable(S, x));
      const locked = RESEARCH.filter(x => !S.research[x.id] && !researchAvailable(S, x));
      h += `<p class="note">Every discovery costs more than the last. Next costs ${fmt(c.knowledge)} Knowledge.</p><div class="list">`;
      for (const x of avail) h += `<div class="row"><div class="row-main"><div class="row-title">${x.name}</div><div class="row-desc">${x.desc}</div></div>${buyBtn('research', x.id, c, 'Learn')}</div>`;
      for (const x of locked) h += `<div class="row locked"><div class="row-main"><div class="row-title">${x.name}</div><div class="row-desc">${x.desc} · needs ${x.after ? RESEARCH.find(y => y.id === x.after).name : 'Tier ' + x.tier}</div></div></div>`;
      h += '</div>';
      const done = RESEARCH.filter(x => S.research[x.id]);
      if (done.length) h += `<div class="sec-title">Learned</div><div class="learned">${done.map(x => `<span class="pill ember" title="${x.desc}">${x.name}</span>`).join('')}</div>`;
    } else {
      h += `<div class="card"><div class="next"><div><div class="name">${S.tokens} Warmth Token${S.tokens === 1 ? '' : 's'}</div><div class="desc">Earned at each thaw. These bonuses are permanent.</div></div></div></div><div class="list">`;
      for (const k in SHOP) {
        const it = SHOP[k], rank = S.shop[k];
        const right = rank >= it.max ? '<span class="pill">Max</span>' : `<button class="btn" data-act="shop" data-arg="${k}" ${S.tokens < it.cost ? 'disabled' : ''}>${it.cost} token${it.cost > 1 ? 's' : ''}</button>`;
        h += `<div class="row"><div class="row-main"><div class="row-title">${it.name} <span class="lvl">${rank}/${it.max}</span></div><div class="row-desc">${it.desc}</div></div>${right}</div>`;
      }
      h += '</div>';
    }
    el.innerHTML = h;
  }
  refreshButtons(el, r);
}

// ---- Jans tab ----
function renderJans(r) {
  const el = $('tab-jans'), cnt = jobCount(S);
  const sig = JSON.stringify([cnt, S.autoAssign, S.bld, S.lost.length, S.jans.map(j => j.v + j.vet).join()]);
  const gm = globalMult(S);
  if (ui.sigs.jans !== sig) {
    ui.sigs.jans = sig;
    let h = `<div class="card"><div class="next"><div><div class="name">${S.jans.length} Jans, ${cnt.idle} idle</div><div class="desc">Idle Jans still eat and still need heat.</div></div>${cnt.idle ? '' : '<span class="pill">All busy</span>'}</div></div>`;
    h += `<div class="list"><div class="switch"><div class="row-main"><div class="row-title">Auto-assign</div><div class="row-desc">${S.bld.furnace >= 4 ? 'Newly rescued Jans go where they are needed most. Turning it on also places anyone idle.' : 'Unlocks at Tier 2 (Furnace 4).'}</div></div><button class="toggle" data-act="auto" aria-pressed="${S.autoAssign}" aria-label="Auto-assign" ${S.bld.furnace < 4 ? 'disabled' : ''}></button></div></div>`;
    h += '<div class="list">';
    for (const job of JOB_ORDER) {
      const J = JOBS[job], B = BLD[J.bld];
      if (!jobAvailable(S, job)) { h += `<div class="row locked"><div class="row-main"><div class="row-title">${J.name}</div><div class="row-desc">Build a ${B.name} (Furnace ${B.unlock})</div></div></div>`; continue; }
      const what = job === 'scavenge' ? 'Random bursts of Wood, Food and Materials' : `Makes ${RES_NAME[J.res]}`;
      h += `<div class="row job"><div class="row-main"><div class="row-title">${J.name} <span class="lvl">${B.name} Lv ${S.bld[J.bld]}</span></div><div class="row-desc">${what}</div><div class="rate c-${J.res || 'materials'}" data-rate="${job}"></div></div>
        <div class="stepper"><button data-act="sub" data-arg="${job}" aria-label="Take a Jan off ${J.name}" ${cnt[job] ? '' : 'disabled'}>−</button><span class="count">${cnt[job]}</span><button data-act="add" data-arg="${job}" aria-label="Put a Jan on ${J.name}" ${cnt.idle ? '' : 'disabled'}>+</button></div></div>`;
    }
    h += '</div>';
    const byV = {};
    for (const j of S.jans) { const k = j.vet ? j.v + '*' : j.v; byV[k] = (byV[k] || 0) + 1; }
    h += `<div class="sec-title">Who's here</div><div class="roster">${Object.entries(byV).map(([k, n]) => `<span class="pill${k.endsWith('*') ? ' ember' : ''}">${k.endsWith('*') ? 'Veteran ' : ''}${VARIANTS[k.replace('*', '')].name} × ${n}</span>`).join('')}</div>`;
    if (S.lost.length) h += `<p class="note">${S.lost.length} Jan${S.lost.length > 1 ? 's' : ''} wandered off in the cold. They come back with the next caravan.</p>`;
    el.innerHTML = h;
  }
  el.querySelectorAll('[data-rate]').forEach(d => {
    const job = d.dataset.rate;
    if (job === 'scavenge') { const n = cnt.scavenge; d.textContent = n ? `about 1 burst every ${fmtDur(scavInterval(S) / (n * gm))}` : 'No one scavenging'; }
    else d.textContent = `${fmtRate(jobRate(S, job, gm))} ${RES_NAME[JOBS[job].res]}/s`;
  });
}

// ---- Collection tab ----
function renderFound() {
  const el = $('tab-found');
  const sig = JSON.stringify(S.found);
  if (ui.sigs.found === sig) return;
  ui.sigs.found = sig;
  const seen = VARIANT_ORDER.filter(v => S.found[v] > 0).length;
  let h = `<div class="progress-line"><b>${seen} of ${VARIANT_ORDER.length}</b> kinds of Jan found · ${S.stats.rescued} rescued in all</div><div class="grid2">`;
  for (const v of VARIANT_ORDER) {
    const V = VARIANTS[v], n = S.found[v];
    h += n ? `<div class="jan-card"><canvas data-portrait="${v}" width="144" height="144"></canvas><b>${V.name}</b><div class="bonus">${V.bonus}</div><p>${CONTENT.bios[v]}</p><div class="seen">${v === 'veteran' ? 'Promoted' : 'Met'} × ${n}</div></div>`
      : `<div class="jan-card unknown"><canvas data-portrait="${v}" data-sil="1" width="144" height="144"></canvas><b>???</b><p>${V.unlockText}</p></div>`;
  }
  el.innerHTML = h + '</div>';
  el.querySelectorAll('canvas[data-portrait]').forEach(c => {
    const g = c.getContext('2d');
    g.clearRect(0, 0, 144, 144);
    const v = c.dataset.portrait;
    drawJan(g, 72, 128, 13, v === 'veteran' ? 'plain' : v, { vet: v === 'veteran', sil: !!c.dataset.sil, t: 0 });
  });
}

      ${ui.confirmReset ? `<div class="card"><p><b>Start over from nothing?</b> This wipes every winter, token and Jan in the collection.</p><div class="actions"><button class="btn ghost" data-act="resetNo">Keep playing</button><button class="btn danger" data-act="resetYes">Wipe and restart</button></div></div>` : '<button class="btn quiet" data-act="reset">Start over…</button>'}

// ---- Toasts ----
function updateToast() {
  const now = performance.now(), el = $('toast');
  if (ui.toastUntil && now < ui.toastUntil) return;
  if (ui.toastQ.length) {
    const t = ui.toastQ.shift();
    el.innerHTML = `<small>${esc(t.kicker)}</small><b>${esc(t.title)}</b><span>${esc(t.text)}</span>`;
    el.hidden = false; ui.toastUntil = now + 6500;
  } else if (!el.hidden) { el.hidden = true; ui.toastUntil = 0; }
}

/* ===================== SCENE ===================== */
// Everything in the city is drawn with simple shapes: placeholder art until the real avatars exist.
const PARKA = { plain: '#C2503A', chef: '#D8663A', spreadsheet: '#3D6D8D', lumberjack: '#A9352B', sleepy: '#7486B0', keys: '#5F8A4C', dj: '#6A4C93', veteran: '#8A7A5C' };
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function ell(c, x, y, rx, ry, fill) { c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2); c.fillStyle = fill; c.fill(); }

// x,y = feet; k = unit size (about 1/20 of the figure's height)
function drawJan(c, x, y, k, v, o = {}) {
  const sil = o.sil, bob = o.bob || 0, frozen = o.frozen || 0;
  const col = n => (sil ? '#9AABBA' : n);
  c.save();
  c.translate(x, y + bob);
  if (!sil) ell(c, 0, 0, 3.4 * k, 1.1 * k, 'rgba(30,50,70,.18)');
  // legs
  c.fillStyle = col('#3A4553');
  rr(c, -1.9 * k, -2.4 * k, 1.5 * k, 2.4 * k, 0.6 * k); c.fill();
  rr(c, 0.4 * k, -2.4 * k, 1.5 * k, 2.4 * k, 0.6 * k); c.fill();
  // parka
  c.fillStyle = col(PARKA[v] || PARKA.plain);
  rr(c, -3 * k, -8 * k, 6 * k, 6.2 * k, 2.4 * k); c.fill();
  if (v === 'lumberjack' && !sil) { c.fillStyle = 'rgba(25,20,20,.45)'; for (let i = -2; i <= 2; i += 2) c.fillRect(i * k - 0.35 * k, -7.6 * k, 0.7 * k, 5.4 * k); c.fillRect(-2.8 * k, -5.6 * k, 5.6 * k, 0.7 * k); }
  if (v === 'chef' && !sil) { c.fillStyle = '#F7F4EE'; rr(c, -1.9 * k, -6.8 * k, 3.8 * k, 4.6 * k, 0.8 * k); c.fill(); }
  if (v === 'sleepy' && !sil) { c.fillStyle = '#A9B8D8'; rr(c, -3.3 * k, -7 * k, 6.6 * k, 3.4 * k, 1.4 * k); c.fill(); }
  // hood
  c.beginPath(); c.arc(0, -10.2 * k, 3.1 * k, 0, Math.PI * 2); c.fillStyle = col(sil ? '#9AABBA' : shade(PARKA[v] || PARKA.plain, -0.18)); c.fill();
  // fur trim + face
  c.beginPath(); c.arc(0, -10 * k, 2.45 * k, 0, Math.PI * 2); c.fillStyle = col('#EEE6DA'); c.fill();
  c.beginPath(); c.arc(0, -10 * k, 1.9 * k, 0, Math.PI * 2); c.fillStyle = col('#F0C8A4'); c.fill();
  if (!sil) {
    c.fillStyle = '#2A2F36';
    if (v === 'sleepy') { c.fillRect(-1.1 * k, -10.5 * k, 0.8 * k, 0.25 * k); c.fillRect(0.3 * k, -10.5 * k, 0.8 * k, 0.25 * k); }
    else { ell(c, -0.7 * k, -10.4 * k, 0.28 * k, 0.32 * k, '#2A2F36'); ell(c, 0.7 * k, -10.4 * k, 0.28 * k, 0.32 * k, '#2A2F36'); }
    ell(c, 0, -9.5 * k, 0.45 * k, 0.4 * k, '#D9544A'); // the red nose
    if (o.vet || v === 'veteran') { c.beginPath(); c.arc(0, -9.4 * k, 1.6 * k, 0.1, Math.PI - 0.1); c.fillStyle = '#C9CCD1'; c.fill(); ell(c, 1.6 * k, -6.4 * k, 0.6 * k, 0.6 * k, '#E2B13C'); }
    if (v === 'chef') { c.fillStyle = '#FFFFFF'; rr(c, -1.8 * k, -15.4 * k, 3.6 * k, 2.6 * k, 0.6 * k); c.fill(); ell(c, 0, -15.6 * k, 2.2 * k, 1.3 * k, '#FFFFFF'); }
    if (v === 'spreadsheet') { c.fillStyle = '#D9C49A'; rr(c, 2.2 * k, -6.8 * k, 2.4 * k, 3.2 * k, 0.3 * k); c.fill(); c.fillStyle = '#7A6A4A'; for (let i = 0; i < 3; i++) c.fillRect(2.6 * k, (-6.1 + i * 0.8) * k, 1.6 * k, 0.25 * k); }
    if (v === 'lumberjack') { c.strokeStyle = '#6B4A2E'; c.lineWidth = 0.6 * k; c.beginPath(); c.moveTo(3 * k, -3 * k); c.lineTo(4.6 * k, -8.4 * k); c.stroke(); c.fillStyle = '#9AA4AE'; c.beginPath(); c.moveTo(4.2 * k, -8.6 * k); c.lineTo(6.2 * k, -8 * k); c.lineTo(5 * k, -6.8 * k); c.closePath(); c.fill(); }
    if (v === 'keys') { c.strokeStyle = '#D6A72E'; c.lineWidth = 0.5 * k; c.beginPath(); c.arc(3.4 * k, -4.6 * k, 0.8 * k, 0, Math.PI * 2); c.stroke(); c.beginPath(); c.moveTo(3.4 * k, -3.8 * k); c.lineTo(3.4 * k, -2.2 * k); c.stroke(); }
    if (v === 'dj') { c.strokeStyle = '#22252A'; c.lineWidth = 0.7 * k; c.beginPath(); c.arc(0, -10.4 * k, 3.4 * k, Math.PI * 1.05, Math.PI * 1.95); c.stroke(); ell(c, -3.1 * k, -10 * k, 0.9 * k, 1.2 * k, '#E2483C'); ell(c, 3.1 * k, -10 * k, 0.9 * k, 1.2 * k, '#E2483C'); }
    if (v === 'sleepy' && o.t != null) { c.fillStyle = '#5A6B7C'; c.font = `700 ${2.4 * k}px system-ui`; c.fillText('z', 2.6 * k, (-13.5 - ((o.t * 0.8) % 2)) * k); }
  }
  if (frozen > 0) {
    c.globalAlpha = frozen * 0.55; c.fillStyle = '#BFE3F5';
    rr(c, -3.4 * k, -13.6 * k, 6.8 * k, 13.6 * k, 3 * k); c.fill();
    c.globalAlpha = frozen; c.strokeStyle = '#7FC1DF'; c.lineWidth = 0.4 * k; c.stroke();
  }
  c.restore();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = ch => clamp(Math.round(ch + (amt < 0 ? ch * amt : (255 - ch) * amt)), 0, 255);
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function drawMeagan(c, x, y, k, t, walking) {
  const step = walking ? Math.sin(t * 12) * 0.6 * k : 0;
  c.save(); c.translate(x, y);
  ell(c, 0, 0, 4.6 * k, 1.5 * k, 'rgba(221,91,26,.25)');
  c.fillStyle = '#2E3440';
  rr(c, -2 * k, -2.6 * k + step, 1.6 * k, 2.6 * k, 0.6 * k); c.fill();
  rr(c, 0.4 * k, -2.6 * k - step, 1.6 * k, 2.6 * k, 0.6 * k); c.fill();
  // long coat
  c.fillStyle = '#1E6E77'; rr(c, -3.3 * k, -9.4 * k, 6.6 * k, 7.6 * k, 2.4 * k); c.fill();
  c.fillStyle = '#E8B04A'; c.fillRect(-0.25 * k, -8.6 * k, 0.5 * k, 6 * k);
  // hair behind
  c.fillStyle = '#6B3E26'; rr(c, -2.8 * k, -13.2 * k, 5.6 * k, 6.4 * k, 2.4 * k); c.fill();
  // face
  c.beginPath(); c.arc(0, -11.6 * k, 2.1 * k, 0, Math.PI * 2); c.fillStyle = '#F2CCAA'; c.fill();
  ell(c, -0.75 * k, -11.8 * k, 0.28 * k, 0.32 * k, '#2A2F36'); ell(c, 0.75 * k, -11.8 * k, 0.28 * k, 0.32 * k, '#2A2F36');
  c.strokeStyle = '#9A4A3A'; c.lineWidth = 0.35 * k; c.beginPath(); c.arc(0, -11 * k, 0.8 * k, 0.2, Math.PI - 0.2); c.stroke();
  // beanie with pom-pom
  c.fillStyle = '#F2EBDD'; c.beginPath(); c.arc(0, -12.6 * k, 2.4 * k, Math.PI, 0); c.fill();
  c.fillStyle = '#DD5B1A'; c.fillRect(-2.4 * k, -12.9 * k, 4.8 * k, 0.9 * k);
  ell(c, 0, -15.3 * k, 1 * k, 1 * k, '#F2EBDD');
  // scarf
  c.fillStyle = '#DD5B1A'; rr(c, -2.4 * k, -9.8 * k, 4.8 * k, 1.4 * k, 0.6 * k); c.fill(); c.fillRect(1.2 * k, -9 * k, 1.2 * k, 3.4 * k);
  c.restore();
}

    ell(c, x, y + 1 * k, 9 * k, 2 * k, 'rgba(30,50,70,.15)');
    c.fillStyle = '#A87B57'; c.fillRect(x - 7 * k, y - 8 * k, 14 * k, 9 * k);
    c.fillStyle = '#6E4B35'; c.beginPath(); c.moveTo(x - 8.5 * k, y - 7.5 * k); c.lineTo(x, y - 13.5 * k); c.lineTo(x + 8.5 * k, y - 7.5 * k); c.closePath(); c.fill();
    c.fillStyle = '#FFFFFF'; c.beginPath(); c.moveTo(x - 8.5 * k, y - 7.5 * k); c.lineTo(x, y - 13.5 * k); c.lineTo(x + 8.5 * k, y - 7.5 * k); c.lineTo(x + 6.5 * k, y - 8.8 * k); c.lineTo(x, y - 12 * k); c.lineTo(x - 6.5 * k, y - 8.8 * k); c.closePath(); c.fill();
    c.fillStyle = '#3A2A20'; c.fillRect(x - 2 * k, y - 4.6 * k, 4 * k, 5.6 * k);
    c.fillStyle = '#F6D48C'; c.fillRect(x - 5.6 * k, y - 6 * k, 2.4 * k, 2.2 * k); c.fillRect(x + 3.2 * k, y - 6 * k, 2.4 * k, 2.2 * k);
    c.fillStyle = '#7C8692'; c.fillRect(x + 8 * k, y - 2 * k, 4 * k, 3 * k); c.fillRect(x + 8.6 * k, y - 3.6 * k, 2.8 * k, 1.6 * k);
  },
  drawHut(x, y) {
    const c = this.c, k = this.k, t = this.t;
    ell(c, x, y + 1 * k, 9.5 * k, 2 * k, 'rgba(30,50,70,.15)');
    c.fillStyle = '#F7FAFC'; c.beginPath(); c.arc(x, y + 1 * k, 8.4 * k, Math.PI, 0); c.closePath(); c.fill();
    c.strokeStyle = '#A9C0D1'; c.lineWidth = 0.5 * k;
    for (let i = 1; i <= 3; i++) { c.beginPath(); c.arc(x, y + 1 * k, 8.4 * k * i / 3.2, Math.PI, 0); c.stroke(); }
    c.beginPath(); c.arc(x, y + 1 * k, 8.4 * k, Math.PI, 0); c.closePath(); c.stroke();
    c.fillStyle = '#2E3440'; c.beginPath(); c.arc(x, y + 1 * k, 2.6 * k, Math.PI, 0); c.fill();
    const lg = c.createRadialGradient(x + 9 * k, y - 4 * k, 0, x + 9 * k, y - 4 * k, 5 * k); lg.addColorStop(0, `rgba(255,214,120,${0.7 + Math.sin(t * 3) * 0.1})`); lg.addColorStop(1, 'rgba(255,214,120,0)');
    c.fillStyle = lg; c.beginPath(); c.arc(x + 9 * k, y - 4 * k, 5 * k, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#6B4A2E'; c.fillRect(x + 8.7 * k, y - 4 * k, 0.6 * k, 5 * k); ell(c, x + 9 * k, y - 4.4 * k, 1 * k, 1.2 * k, '#F6C04A');
  },
  drawPost(x, y) {
    const c = this.c, k = this.k, t = this.t;
    c.fillStyle = '#6B4A2E'; c.fillRect(x - 0.4 * k, y - 12 * k, 0.8 * k, 12 * k);
    c.fillStyle = '#DD5B1A'; c.beginPath(); c.moveTo(x + 0.4 * k, y - 12 * k); c.quadraticCurveTo(x + 4 * k, y - 11 * k + Math.sin(t * 4) * k, x + 7 * k, y - 10 * k); c.lineTo(x + 0.4 * k, y - 8 * k); c.closePath(); c.fill();
    c.fillStyle = '#9C6B44'; rr(c, x + 2 * k, y - 2.6 * k, 8 * k, 2 * k, 0.6 * k); c.fill();
    c.strokeStyle = '#5B6573'; c.lineWidth = 0.5 * k; c.beginPath(); c.moveTo(x + 1.4 * k, y + 0.2 * k); c.lineTo(x + 10.6 * k, y + 0.2 * k); c.quadraticCurveTo(x + 12 * k, y + 0.2 * k, x + 11.4 * k, y - 1.4 * k); c.stroke();
  },
  drawPlot(x, y, name) {
    const c = this.c, k = this.k;
    c.setLineDash([2 * k, 1.6 * k]); c.strokeStyle = '#AFC2D1'; c.lineWidth = 0.5 * k; c.beginPath(); c.ellipse(x, y - 1 * k, 8 * k, 3 * k, 0, 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
    c.fillStyle = '#8A6A4E'; c.fillRect(x - 0.3 * k, y - 7 * k, 0.6 * k, 6 * k); c.fillStyle = '#C9A57E'; rr(c, x - 3.6 * k, y - 8.4 * k, 7.2 * k, 2.6 * k, 0.4 * k); c.fill();
  },
  drawShed(x, y, col, steam) {
    const c = this.c, k = this.k, t = this.t;
    ell(c, x, y + 0.6 * k, 5 * k, 1.3 * k, 'rgba(30,50,70,.14)');
    c.fillStyle = col; c.fillRect(x - 4 * k, y - 5 * k, 8 * k, 5.4 * k);
    c.fillStyle = '#FFFFFF'; rr(c, x - 4.8 * k, y - 6.6 * k, 9.6 * k, 2 * k, 0.8 * k); c.fill();
    c.fillStyle = '#3A2A20'; c.fillRect(x - 1.2 * k, y - 3 * k, 2.4 * k, 3.4 * k);
    if (steam) for (let i = 0; i < 2; i++) { const p = (t * 0.4 + i / 2) % 1; ell(c, x + 2.4 * k, y - 7 * k - p * 7 * k, (0.8 + p * 1.6) * k, (0.8 + p * 1.6) * k, `rgba(255,255,255,${0.7 * (1 - p)})`); }
  },
  drawCabin(x, y) {
    const c = this.c, k = this.k;
    ell(c, x, y + 0.6 * k, 8 * k, 1.5 * k, 'rgba(30,50,70,.14)');
    c.fillStyle = '#7A5A40'; c.fillRect(x - 7 * k, y - 5 * k, 14 * k, 5.4 * k);
    c.fillStyle = '#5E4430'; for (let i = 0; i < 3; i++) c.fillRect(x - 7 * k, y - 4.4 * k + i * 1.7 * k, 14 * k, 0.4 * k);
    c.fillStyle = '#FFFFFF'; rr(c, x - 7.8 * k, y - 6.8 * k, 15.6 * k, 2.2 * k, 1 * k); c.fill();
    c.fillStyle = '#F6D48C'; c.fillRect(x - 4.6 * k, y - 3.6 * k, 1.8 * k, 1.6 * k); c.fillRect(x + 2.8 * k, y - 3.6 * k, 1.8 * k, 1.6 * k);
  },
  drawSprings(x, y) {
    const c = this.c, k = this.k, t = this.t;
    ell(c, x, y, 7 * k, 2.6 * k, '#C9D6E0'); ell(c, x, y, 6 * k, 2 * k, '#7FC1DF');
    for (let i = 0; i < 3; i++) { const p = (t * 0.35 + i / 3) % 1; ell(c, x - 3 * k + i * 3 * k, y - 2 * k - p * 7 * k, (0.8 + p * 1.8) * k, (0.8 + p * 1.8) * k, `rgba(255,255,255,${0.6 * (1 - p)})`); }
  },
  drawTower(x, y) {
    const c = this.c, k = this.k;
    c.strokeStyle = '#6B4A2E'; c.lineWidth = 0.7 * k; c.beginPath(); c.moveTo(x - 2.6 * k, y); c.lineTo(x - 1.4 * k, y - 13 * k); c.moveTo(x + 2.6 * k, y); c.lineTo(x + 1.4 * k, y - 13 * k); c.moveTo(x - 2.2 * k, y - 4 * k); c.lineTo(x + 2.2 * k, y - 8 * k); c.stroke();
    c.fillStyle = '#8B5E3C'; c.fillRect(x - 2.6 * k, y - 15 * k, 5.2 * k, 2.4 * k); c.fillStyle = '#FFFFFF'; rr(c, x - 3 * k, y - 16.4 * k, 6 * k, 1.6 * k, 0.6 * k); c.fill();
  },
  drawLights(fx, fy, tier, t) {
    const c = this.c, k = this.k, n = tier >= 3 ? 16 : 10, rx = this.W * 0.2, ry = this.H * 0.16;
    const cols = ['#F6C04A', '#E2483C', '#7FC1DF', '#8BC48A'];
    c.strokeStyle = 'rgba(60,70,80,.35)'; c.lineWidth = 0.4 * k; c.beginPath(); c.ellipse(fx, fy - 3 * k, rx, ry, 0, Math.PI * 0.05, Math.PI * 0.95); c.stroke();
    for (let i = 0; i <= n; i++) { const a = Math.PI * (0.05 + 0.9 * i / n), x = fx + Math.cos(a) * rx, y = fy - 3 * k + Math.sin(a) * ry; const on = 0.6 + 0.4 * Math.sin(t * 3 + i); ell(c, x, y, 0.9 * k, 0.9 * k, cols[i % 4]); c.globalAlpha = 0.25 * on; ell(c, x, y, 2.2 * k, 2.2 * k, cols[i % 4]); c.globalAlpha = 1; }
  },
};

// ===== LOOP =====
function boot(data) {
  S = (data && data.state) || load();
  const fresh = !S;
  if (!S) S = newState();
  if (data && data.ui) { ui.tab = data.ui.tab || 'city'; ui.seg = data.ui.seg || 'buildings'; ui.speed = data.ui.speed || 1; ui.log = data.ui.log || []; }
  renderChips();
  scene.init();
  setTab(ui.tab);
  if (!(data && data.state)) openSheet(fresh || S.t < 5 ? 'intro' : 'welcome');
  window.claude?.hot?.snapshot?.(() => ({ state: S, ui: { tab: ui.tab, seg: ui.seg, speed: ui.speed, log: ui.log } }));
  let last = performance.now();
  const ev = [];
  function frame(now) {
    const rdt = Math.min(0.25, (now - last) / 1000); last = now;
    const paused = ui.manualPause || ui.sheet || document.hidden;
    if (!paused) {
      let gdt = rdt * ui.speed;
      while (gdt > 0) { const st = Math.min(0.5, gdt); gdt -= st; ev.length = 0; tick(S, st, ev); if (ev.length) handleEvents(ev); }
    }
    if (ui.tab === 'city') { scene.update(paused ? 0 : rdt); scene.draw(); }
    ui.uiT -= rdt;
    if (ui.uiT <= 0) {
      ui.uiT = 0.2;
      const r = rates(S);
      updateHUD(r);
      if (ui.tab === 'city') renderCity(r); else if (ui.tab === 'build') renderBuild(r); else if (ui.tab === 'jans') renderJans(r); else renderFound();
      updateToast();
    }
    ui.saveT -= rdt;
    if (ui.saveT <= 0 && !paused) { ui.saveT = 5; save(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
